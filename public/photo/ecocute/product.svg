<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- 背景 -->
  <rect width="400" height="320" rx="16" fill="#f0f7ff"/>

  <!-- 地面 -->
  <rect x="0" y="260" width="400" height="60" rx="0" fill="#e8eef5"/>

  <!-- エコキュート本体（タンク） -->
  <rect x="140" y="80" width="90" height="180" rx="12" fill="#c8d8e8" stroke="#8ba8c8" stroke-width="2"/>
  <rect x="148" y="90" width="74" height="30" rx="6" fill="#0055B8"/>
  <text x="185" y="110" text-anchor="middle" fill="white" font-size="11" font-weight="bold" font-family="sans-serif">ECO CUTE</text>

  <!-- 操作パネル -->
  <rect x="155" y="130" width="60" height="40" rx="4" fill="#1a2b40"/>
  <rect x="160" y="135" width="50" height="25" rx="2" fill="#2a4a6a"/>
  <text x="185" y="152" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold" font-family="monospace">42°C</text>
  <circle cx="170" cy="163" r="2" fill="#4ade80"/>
  <circle cx="178" cy="163" r="2" fill="#e8a817"/>
  <circle cx="186" cy="163" r="2" fill="#0055B8"/>

  <!-- 配管 -->
  <path d="M185 260 L185 280 M160 270 L210 270" stroke="#8ba8c8" stroke-width="3" stroke-linecap="round"/>

  <!-- ヒートポンプユニット -->
  <rect x="250" y="180" width="80" height="80" rx="8" fill="#d4dfe8" stroke="#8ba8c8" stroke-width="2"/>
  <circle cx="290" cy="220" r="25" fill="none" stroke="#0055B8" stroke-width="2"/>
  <!-- ファン羽根 -->
  <path d="M290 200 L295 215 L290 212 L285 215 Z" fill="#0055B8" opacity="0.6"/>
  <path d="M310 220 L295 225 L298 220 L295 215 Z" fill="#0055B8" opacity="0.6"/>
  <path d="M290 240 L285 225 L290 228 L295 225 Z" fill="#0055B8" opacity="0.6"/>
  <path d="M270 220 L285 215 L282 220 L285 225 Z" fill="#0055B8" opacity="0.6"/>

  <!-- 接続配管 -->
  <path d="M230 230 L250 230" stroke="#8ba8c8" stroke-width="3" stroke-linecap="round"/>
  <path d="M230 210 L250 210" stroke="#e8a817" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 3"/>

  <!-- 湯気 -->
  <path d="M170 70 Q175 55 170 45" stroke="#0055B8" stroke-width="2" stroke-linecap="round" opacity="0.3">
    <animate attributeName="d" values="M170 70 Q175 55 170 45;M170 70 Q165 55 170 40;M170 70 Q175 55 170 45" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M185 75 Q190 58 185 48" stroke="#0055B8" stroke-width="2" stroke-linecap="round" opacity="0.2">
    <animate attributeName="d" values="M185 75 Q190 58 185 48;M185 75 Q180 58 185 43;M185 75 Q190 58 185 48" dur="3.5s" repeatCount="indefinite"/>
  </path>
  <path d="M200 70 Q205 55 200 45" stroke="#0055B8" stroke-width="2" stroke-linecap="round" opacity="0.25">
    <animate attributeName="d" values="M200 70 Q205 55 200 45;M200 70 Q195 55 200 40;M200 70 Q205 55 200 45" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- ラベル -->
  <text x="185" y="300" text-anchor="middle" fill="#8ba8c8" font-size="10" font-family="sans-serif">貯湯タンクユニット</text>
  <text x="290" y="300" text-anchor="middle" fill="#8ba8c8" font-size="10" font-family="sans-serif">ヒートポンプユニット</text>

  <!-- エコマーク -->
  <circle cx="60" cy="50" r="28" fill="#06C755" opacity="0.15"/>
  <text x="60" y="46" text-anchor="middle" fill="#06C755" font-size="10" font-weight="bold" font-family="sans-serif">ECO</text>
  <text x="60" y="58" text-anchor="middle" fill="#06C755" font-size="8" font-family="sans-serif">省エネ</text>
</svg>
