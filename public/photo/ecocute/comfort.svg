<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" rx="16" fill="#f8fbff"/>

  <!-- 家の外観 -->
  <g transform="translate(60, 40)">
    <!-- 屋根 -->
    <polygon points="140,0 0,70 280,70" fill="#3a5a7c" opacity="0.8"/>
    <!-- 壁 -->
    <rect x="20" y="70" width="240" height="140" fill="#e8eef5"/>
    <!-- ドア -->
    <rect x="115" y="130" width="50" height="80" rx="3" fill="#6a8ab0"/>
    <circle cx="155" cy="175" r="3" fill="#c8d8e8"/>
    <!-- 窓 -->
    <rect x="40" y="90" width="55" height="45" rx="3" fill="#d4e4f4" stroke="#8ba8c8" stroke-width="1.5"/>
    <line x1="67" y1="90" x2="67" y2="135" stroke="#8ba8c8" stroke-width="1"/>
    <line x1="40" y1="112" x2="95" y2="112" stroke="#8ba8c8" stroke-width="1"/>
    <rect x="185" y="90" width="55" height="45" rx="3" fill="#d4e4f4" stroke="#8ba8c8" stroke-width="1.5"/>
    <line x1="212" y1="90" x2="212" y2="135" stroke="#8ba8c8" stroke-width="1"/>
    <line x1="185" y1="112" x2="240" y2="112" stroke="#8ba8c8" stroke-width="1"/>

    <!-- 窓からの暖かい光 -->
    <rect x="42" y="92" width="23" height="18" rx="1" fill="#fff3d0" opacity="0.6"/>
    <rect x="69" y="92" width="24" height="18" rx="1" fill="#fff3d0" opacity="0.6"/>
    <rect x="187" y="92" width="23" height="18" rx="1" fill="#fff3d0" opacity="0.5"/>
    <rect x="214" y="92" width="24" height="18" rx="1" fill="#fff3d0" opacity="0.5"/>

    <!-- 太陽光パネル -->
    <g transform="translate(90, 10)">
      <rect width="100" height="45" rx="2" fill="#2a4a6a" transform="rotate(-14)" opacity="0.7"/>
      <line x1="5" y1="0" x2="-5" y2="40" stroke="#4a7ab0" stroke-width="0.5" transform="rotate(-14)"/>
      <line x1="25" y1="0" x2="15" y2="40" stroke="#4a7ab0" stroke-width="0.5" transform="rotate(-14)"/>
      <line x1="45" y1="0" x2="35" y2="40" stroke="#4a7ab0" stroke-width="0.5" transform="rotate(-14)"/>
      <line x1="65" y1="0" x2="55" y2="40" stroke="#4a7ab0" stroke-width="0.5" transform="rotate(-14)"/>
      <line x1="85" y1="0" x2="75" y2="40" stroke="#4a7ab0" stroke-width="0.5" transform="rotate(-14)"/>
    </g>
  </g>

  <!-- エコキュート（家の横） -->
  <g transform="translate(30, 150)">
    <rect x="0" y="10" width="25" height="55" rx="4" fill="#c8d8e8" stroke="#8ba8c8" stroke-width="1.5"/>
    <text x="12" y="35" text-anchor="middle" fill="#0055B8" font-size="6" font-weight="bold" font-family="sans-serif">ECO</text>
    <!-- 湯気 -->
    <path d="M8 10 Q12 2 8 -5" stroke="#0055B8" stroke-width="1" opacity="0.3" stroke-linecap="round">
      <animate attributeName="d" values="M8 10 Q12 2 8 -5;M8 10 Q4 2 8 -8;M8 10 Q12 2 8 -5" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M18 8 Q22 0 18 -6" stroke="#0055B8" stroke-width="1" opacity="0.2" stroke-linecap="round">
      <animate attributeName="d" values="M18 8 Q22 0 18 -6;M18 8 Q14 0 18 -9;M18 8 Q22 0 18 -6" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- お風呂の幸せアイコン -->
  <g transform="translate(310, 60)">
    <circle cx="25" cy="25" r="25" fill="#e8a817" opacity="0.15"/>
    <text x="25" y="22" text-anchor="middle" fill="#e8a817" font-size="9" font-weight="bold" font-family="sans-serif">快適</text>
    <text x="25" y="34" text-anchor="middle" fill="#e8a817" font-size="9" font-weight="bold" font-family="sans-serif">お湯</text>
  </g>

  <!-- 省エネアイコン -->
  <g transform="translate(310, 130)">
    <circle cx="25" cy="25" r="25" fill="#06C755" opacity="0.15"/>
    <text x="25" y="22" text-anchor="middle" fill="#06C755" font-size="9" font-weight="bold" font-family="sans-serif">光熱費</text>
    <text x="25" y="34" text-anchor="middle" fill="#06C755" font-size="9" font-weight="bold" font-family="sans-serif">節約</text>
  </g>

  <!-- 補助金アイコン -->
  <g transform="translate(310, 200)">
    <circle cx="25" cy="25" r="25" fill="#0055B8" opacity="0.15"/>
    <text x="25" y="22" text-anchor="middle" fill="#0055B8" font-size="9" font-weight="bold" font-family="sans-serif">補助金</text>
    <text x="25" y="34" text-anchor="middle" fill="#0055B8" font-size="9" font-weight="bold" font-family="sans-serif">対象</text>
  </g>

  <!-- 太陽 -->
  <circle cx="360" cy="30" r="15" fill="#e8a817" opacity="0.3"/>
  <g transform="translate(360, 30)">
    <line x1="0" y1="-22" x2="0" y2="-18" stroke="#e8a817" stroke-width="1.5" opacity="0.3"/>
    <line x1="15" y1="-15" x2="12" y2="-12" stroke="#e8a817" stroke-width="1.5" opacity="0.3"/>
    <line x1="22" y1="0" x2="18" y2="0" stroke="#e8a817" stroke-width="1.5" opacity="0.3"/>
    <line x1="-22" y1="0" x2="-18" y2="0" stroke="#e8a817" stroke-width="1.5" opacity="0.3"/>
    <line x1="-15" y1="-15" x2="-12" y2="-12" stroke="#e8a817" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="250" width="400" height="30" rx="0" fill="#e8eef5"/>
</svg>
